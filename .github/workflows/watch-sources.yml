name: Source check

# Every morning, read the official page behind each published scheme and keep the registry
# current: re-verify unchanged schemes, move deadlines, turn a rule whose quote vanished into
# "confirm on the official site". See src/server/services/source-watch.ts.
on:
  schedule:
    - cron: "30 0 * * *" # 6:00 AM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: false

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check official pages
        env:
          # Neon connection string (Settings → Secrets and variables → Actions).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL secret first"; exit 1; fi
          npm run sources:check -- ${{ inputs.dry_run && '--dry-run' || '' }}
